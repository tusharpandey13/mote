<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mote — D-pad press</title>
<link rel="stylesheet" href="mote.css">
<style></style>
</head>
<body>
<div class="screen" style="height:300px;grid-template-rows:1fr;padding:20px 0" data-dc-id="screen">
  <div style="display:flex;justify-content:space-around;align-items:center" data-dc-id="dpad-press-compare">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;transform:scale(.88)"><div data-dc-id="dpad-rest"><div class="dpad-wrap" data-dc-id="dpad-bezel"><svg class="dpad" viewBox="0 0 208 208" data-dc-id="dpad">
        <defs><linearGradient id="dpk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rub-top)"/><stop offset="1" style="stop-color:var(--rub-bot)"/></linearGradient><linearGradient id="bev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#fff;stop-opacity:.9"/><stop offset=".35" style="stop-color:#fff;stop-opacity:0"/><stop offset=".7" style="stop-color:#000;stop-opacity:0"/><stop offset="1" style="stop-color:#000;stop-opacity:.22"/></linearGradient><linearGradient id="bevp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#000;stop-opacity:.30"/><stop offset=".4" style="stop-color:#000;stop-opacity:0"/><stop offset=".75" style="stop-color:#fff;stop-opacity:0"/><stop offset="1" style="stop-color:#fff;stop-opacity:.55"/></linearGradient><filter id="gr" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values=".8 .8 .8 0 -.7 .8 .8 .8 0 -.7 .8 .8 .8 0 -.7 0 0 0 0 .9"/></filter><clipPath id="cdisc"><circle cx="104" cy="104" r="96"/></clipPath><clipPath id="ccap"><circle cx="104" cy="104" r="35"/></clipPath></defs>
        <circle class="housing" cx="104" cy="104" r="99"/>
        <circle class="contact" cx="104" cy="110" r="92"/>
        <circle class="disc" cx="104" cy="104" r="96" fill="url(#dpk)" data-dc-id="dpad-rubber"/>
        <rect class="grain" x="8" y="8" width="192" height="192" filter="url(#gr)" clip-path="url(#cdisc)" opacity=".5"/>
        <circle class="bevel" cx="104" cy="104" r="95.25" stroke="url(#bev)" data-dc-id="dpad-bevel"/>
        <g data-dc-id="dpad-up"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g><g data-dc-id="dpad-right" transform="rotate(90 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g><g data-dc-id="dpad-down" transform="rotate(180 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g><g data-dc-id="dpad-left" transform="rotate(270 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g>
        <g><line class="div" x1="73" y1="73" x2="47" y2="47"/><line class="div" x1="135" y1="73" x2="161" y2="47"/><line class="div" x1="73" y1="135" x2="47" y2="161"/><line class="div" x1="135" y1="135" x2="161" y2="161"/></g>
        <circle class="ring" cx="104" cy="104" r="42"/><g data-dc-id="dpad-center" class="okcap"><circle class="cap" cx="104" cy="104" r="35" fill="url(#dpk)"/><rect class="grain" x="69" y="69" width="70" height="70" filter="url(#gr)" clip-path="url(#ccap)" opacity=".5"/><circle class="bevel" cx="104" cy="104" r="34.25" stroke="url(#bev)"/><text class="ok" x="104" y="109.5" text-anchor="middle" data-dc-id="dpad-center-legend">OK</text></g>
      </svg></div></div><span class="t-caps subtle">Rest</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;transform:scale(.88)"><div data-dc-id="dpad-pressed"><div class="dpad-wrap" data-dc-id="dpad-bezel"><svg class="dpad" viewBox="0 0 208 208" data-dc-id="dpad">
        <defs><linearGradient id="dpk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rub-top)"/><stop offset="1" style="stop-color:var(--rub-bot)"/></linearGradient><linearGradient id="bev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#fff;stop-opacity:.9"/><stop offset=".35" style="stop-color:#fff;stop-opacity:0"/><stop offset=".7" style="stop-color:#000;stop-opacity:0"/><stop offset="1" style="stop-color:#000;stop-opacity:.22"/></linearGradient><linearGradient id="bevp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#000;stop-opacity:.30"/><stop offset=".4" style="stop-color:#000;stop-opacity:0"/><stop offset=".75" style="stop-color:#fff;stop-opacity:0"/><stop offset="1" style="stop-color:#fff;stop-opacity:.55"/></linearGradient><filter id="gr" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values=".8 .8 .8 0 -.7 .8 .8 .8 0 -.7 .8 .8 .8 0 -.7 0 0 0 0 .9"/></filter><clipPath id="cdisc"><circle cx="104" cy="104" r="96"/></clipPath><clipPath id="ccap"><circle cx="104" cy="104" r="35"/></clipPath></defs>
        <circle class="housing" cx="104" cy="104" r="99"/>
        <circle class="contact" cx="104" cy="110" r="92"/>
        <circle class="disc" cx="104" cy="104" r="96" fill="url(#dpk)" data-dc-id="dpad-rubber"/>
        <rect class="grain" x="8" y="8" width="192" height="192" filter="url(#gr)" clip-path="url(#cdisc)" opacity=".5"/>
        <circle class="bevel" cx="104" cy="104" r="95.25" stroke="url(#bev)" data-dc-id="dpad-bevel"/>
        <g data-dc-id="dpad-up"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g><g data-dc-id="dpad-right" transform="rotate(90 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g><g data-dc-id="dpad-down" transform="rotate(180 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g><g data-dc-id="dpad-left" transform="rotate(270 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g>
        <g><line class="div" x1="73" y1="73" x2="47" y2="47"/><line class="div" x1="135" y1="73" x2="161" y2="47"/><line class="div" x1="73" y1="135" x2="47" y2="161"/><line class="div" x1="135" y1="135" x2="161" y2="161"/></g>
        <circle class="ring" cx="104" cy="104" r="42"/><g data-dc-id="dpad-center" class="okcap is-pressed"><circle class="cap" cx="104" cy="104" r="35" fill="url(#dpk)"/><rect class="grain" x="69" y="69" width="70" height="70" filter="url(#gr)" clip-path="url(#ccap)" opacity=".5"/><circle class="bevel" cx="104" cy="104" r="34.25" stroke="url(#bevp)"/><text class="ok" x="104" y="109.5" text-anchor="middle" data-dc-id="dpad-center-legend">OK</text></g>
      </svg></div></div><span class="t-caps subtle">OK pressed: legend moves with cap</span></div>
  </div>
</div>
<script src="icons.js"></script>
</body>
</html>
