<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mote — Media</title>
<link rel="stylesheet" href="mote.css">
<style>
  .media { display: flex; flex-direction: column; height: 100%; }
  .fav-head { display: flex; align-items: center; justify-content: space-between; height: 32px; color: var(--on-surface-subtle); }
  .fav-head span { display: inline-flex; align-items: center; gap: 6px; }
  .cap-row { display: flex; justify-content: space-between; align-items: center; height: 16px; margin-top: 4px; color: var(--on-surface-subtle); font: 500 11px/1 var(--font-ui); }
  .carousel { margin-top: 4px; }
  .favs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .fav { height: 52px; border-radius: 16px; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 6px; position: relative; color: var(--on-surface); }
  .fav .lb { font: 600 13px/16px var(--font-ui); color: var(--on-surface-muted); white-space: nowrap; }
  .sec-row { margin-top: auto; padding-top: 12px; }
  .sec-row .pair.small .cap { height: 64px; border-radius: 17px; color: var(--on-surface) !important; }
  .sec-row .pair.small { border-radius: 22px; }
  .cluster { position: relative; height: 252px; margin-top: 14px; align-items: start; display: grid; grid-template-columns: 56px 236px 56px; justify-content: space-between; }
  .cluster .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cluster .dpad-wrap { margin-top: 0; }
  .transport { margin-top: 14px; grid-template-columns: 76px 1fr 76px !important; }
  .transport .glass.sm, .transport .glass.play { height: 96px; border-radius: 24px; }
  .cluster .slider { height: 232px; }
  .dark .engrave { color: #4F535B; }
</style>
</head>
<body>
<div class="screen" data-dc-id="screen">
  <div class="statusbar" data-dc-id="statusbar"><span>9:41</span><span class="sys"><i data-i="wifiBars" class="i16"></i><i data-i="battery" class="i20"></i></span></div>
  <header class="topbar" data-dc-id="topbar">
    <div class="pill raised" data-dc-id="connection-pill">
      <span class="led" data-dc-id="pill-led"></span>
      <span class="name" data-dc-id="pill-name">MacBook Pro</span>
      <i data-i="chevDown" class="i20 chev" data-dc-id="pill-chevron"></i>
    </div>
    <div class="brand" data-dc-id="brand">
      <span class="wordmark lit bulb" data-dc-id="wordmark"><span class="wm-spill" data-dc-id="wordmark-spill"></span><span class="wm-glow" aria-hidden="true">MOTE</span><span class="wm-core">MOTE</span><span class="wm-spec" aria-hidden="true">MOTE</span></span>
      <div class="icon-btn" data-dc-id="menu"><i data-i="more" class="i20"></i></div>
    </div>
  </header>
  <main class="content media" data-dc-id="media-content">
    <section class="fav-wrap" data-dc-id="fav-strip">
      <div class="fav-head"><span class="t-caps"><i data-i="starFill" class="i16"></i>Favourites</span><span class="edit-chip raised" data-dc-id="fav-edit"><i data-i="edit" class="i16"></i>Edit</span></div>
      <div class="cap-row"><span>Spaces</span><span>swipe or tap a desktop</span></div>
      <div class="carousel well" data-dc-id="fav-next-space">
        <div class="rowc"><div class="scard raised" data-dc-id="fav-next-space-card-1"><span class="num">1</span><span class="nm">Desktop 1</span></div><div class="scard current raised" data-dc-id="fav-next-space-card-2"><span class="cur-dot"></span><span class="num">2</span><span class="nm">Desktop 2</span></div><div class="scard raised" data-dc-id="fav-next-space-card-3"><span class="num">3</span><span class="nm">Desktop 3</span></div><div class="scard raised" data-dc-id="fav-next-space-card-4"><span class="num">4</span><span class="nm">Desktop 4</span></div><div class="scard raised" data-dc-id="fav-next-space-card-5"><span class="num">5</span><span class="nm">Desktop 5</span></div><div class="scard raised" data-dc-id="fav-next-space-card-6"><span class="num">6</span><span class="nm">Desktop 6</span></div></div>
        <span class="fade-r"></span>
      </div>
      <div class="favs"><div class="fav add" style="grid-column: span 4" data-dc-id="fav-add"><i data-i="plus" class="i20"></i><span class="lb">Add favourite</span></div></div>
    </section>

    <div class="sec-row" data-dc-id="brightness-row">
      <div class="pair small well" data-dc-id="brightness-group">
        <div class="cap raised" data-dc-id="brightness-down"><span class="arrowed"><i data-i="sunDown"></i><i data-i="arrowDown" class="i20" data-dc-id="brightness-down-arrow"></i></span></div>
        <div class="cap raised" data-dc-id="brightness-up"><span class="arrowed"><i data-i="sunUp"></i><i data-i="arrowUp" class="i20" data-dc-id="brightness-up-arrow"></i></span></div>
      </div>
    </div>

    <div class="cluster" data-dc-id="dpad-row">
      <div class="col">
        <div class="slider well" data-dc-id="scroll-lever">
          <span class="end" data-dc-id="scroll-lever-top"><i data-i="triUp" class="i16"></i></span>
          <span class="ticks"></span>
          <div class="thumb" data-dc-id="scroll-lever-thumb"><span class="grip"></span><span class="grip"></span><span class="grip"></span></div>
          <span class="end" data-dc-id="scroll-lever-bottom"><i data-i="triDown" class="i16"></i></span>
        </div>
        <span class="engrave" data-dc-id="scroll-lever-label">Scroll</span>
      </div>
      <div class="dpad-wrap js" data-dc-id="dpad-bezel"><svg class="dpad" viewBox="0 0 236 236" data-dc-id="dpad">
        <defs>
          <linearGradient id="dpk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rub-top)"/><stop offset="1" style="stop-color:var(--rub-bot)"/></linearGradient>
          <linearGradient id="conc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--rub-bot)"/><stop offset="1" style="stop-color:var(--rub-top)"/></linearGradient>
          <radialGradient id="concshade" cx=".5" cy=".38" r=".62"><stop offset=".55" style="stop-color:#000;stop-opacity:0"/><stop offset="1" style="stop-color:#000;stop-opacity:.22"/></radialGradient>
          <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--gate-0)"/><stop offset=".48" style="stop-color:var(--gate-1)"/><stop offset=".52" style="stop-color:var(--gate-2)"/><stop offset="1" style="stop-color:var(--gate-3)"/></linearGradient>
          <linearGradient id="bev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#fff;stop-opacity:.9"/><stop offset=".35" style="stop-color:#fff;stop-opacity:0"/><stop offset=".7" style="stop-color:#000;stop-opacity:0"/><stop offset="1" style="stop-color:#000;stop-opacity:.22"/></linearGradient>
          <linearGradient id="bevin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#000;stop-opacity:.45"/><stop offset=".45" style="stop-color:#000;stop-opacity:0"/><stop offset=".8" style="stop-color:#fff;stop-opacity:0"/><stop offset="1" style="stop-color:#fff;stop-opacity:.5"/></linearGradient>
          <pattern id="grip" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".85" style="fill:var(--lo)"/></pattern>
          <filter id="gr" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values=".8 .8 .8 0 -.7 .8 .8 .8 0 -.7 .8 .8 .8 0 -.7 0 0 0 0 .9"/></filter>
          <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
          <filter id="glowblur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
          <clipPath id="cdisc"><circle cx="118" cy="118" r="110"/></clipPath>
          <clipPath id="cstick"><circle cx="118.00" cy="118.00" r="38"/></clipPath>
        </defs>
        <circle class="housing" cx="118" cy="118" r="113"/>
        <circle class="contact" cx="118" cy="124" r="106"/>
        <circle class="disc" cx="118" cy="118" r="110" fill="url(#dpk)" data-dc-id="dpad-rubber"/>
        <rect class="grain" x="8" y="8" width="220" height="220" filter="url(#gr)" clip-path="url(#cdisc)" opacity=".5"/>
        <circle class="bevel" cx="118" cy="118" r="109.25" stroke="url(#bev)" data-dc-id="dpad-bevel"/>
        <g data-dc-id="dpad-up"><path class="arm" d="M40.22 40.22A110 110 0 0 1 195.78 40.22L168.91 67.09A72 72 0 0 0 67.09 67.09Z"/><path class="tri" d="M118 22l7 9.5h-14z"/></g><g data-dc-id="dpad-right" transform="rotate(90 118 118)"><path class="arm" d="M40.22 40.22A110 110 0 0 1 195.78 40.22L168.91 67.09A72 72 0 0 0 67.09 67.09Z"/><path class="tri" d="M118 22l7 9.5h-14z"/></g><g data-dc-id="dpad-down" transform="rotate(180 118 118)"><path class="arm" d="M40.22 40.22A110 110 0 0 1 195.78 40.22L168.91 67.09A72 72 0 0 0 67.09 67.09Z"/><path class="tri" d="M118 22l7 9.5h-14z"/></g><g data-dc-id="dpad-left" transform="rotate(270 118 118)"><path class="arm" d="M40.22 40.22A110 110 0 0 1 195.78 40.22L168.91 67.09A72 72 0 0 0 67.09 67.09Z"/><path class="tri" d="M118 22l7 9.5h-14z"/></g>
        <g><line class="div" x1="171.0" y1="65.0" x2="192.2" y2="43.8"/><line class="div" x1="171.0" y1="171.0" x2="192.2" y2="192.2"/><line class="div" x1="65.0" y1="171.0" x2="43.8" y2="192.2"/><line class="div" x1="65.0" y1="65.0" x2="43.8" y2="43.8"/></g>
        <g data-dc-id="dpad-stick-gate"><circle cx="118" cy="118" r="68" fill="url(#gate)"/><circle class="gate-hi" cx="118" cy="118" r="67.5"/>
          <circle cx="118" cy="118" r="63" style="fill:var(--well)"/><circle cx="118" cy="118" r="62" fill="none" stroke="url(#bevin)" stroke-width="2"/></g>
        
        <g data-dc-id="dpad-center">
          <circle class="stick-shadow" cx="118.00" cy="122.00" r="45" filter="url(#soft)"/>
          <circle cx="118.00" cy="118.00" r="45" fill="url(#dpk)"/>
          <circle cx="118.00" cy="118.00" r="39" fill="url(#conc)"/>
          <circle cx="118.00" cy="118.00" r="39" fill="url(#concshade)"/>
          <rect x="73.00" y="73.00" width="90" height="90" fill="url(#grip)" clip-path="url(#cstick)" opacity=".9"/>
          <circle class="bevel" cx="118.00" cy="118.00" r="44.25" stroke="url(#bev)"/>
          <circle cx="118.00" cy="118.00" r="39" fill="none" stroke="url(#bevin)" stroke-width="1.2"/>
          <g data-dc-id="dpad-center-legend" transform="translate(108.50 107.00) scale(.85)"><path class="legend-engr" d="M6 3.8l12.4 6.9c.6.33.5 1.22-.15 1.42l-5.1 1.55a1 1 0 0 0-.62.53l-2.3 4.85c-.3.62-1.2.55-1.4-.1z" style="stroke:var(--hi)" transform="translate(0 1)"/><path class="legend-engr" d="M6 3.8l12.4 6.9c.6.33.5 1.22-.15 1.42l-5.1 1.55a1 1 0 0 0-.62.53l-2.3 4.85c-.3.62-1.2.55-1.4-.1z" style="stroke:var(--on-surface-muted)"/></g>
        </g>
      </svg></div>
      <div class="col">
        <div class="slider well vol" data-dc-id="volume-group">
          <span class="end" data-dc-id="volume-group-top">+</span>
          <span class="ticks"></span>
          <div class="thumb" data-dc-id="volume-group-thumb"><i data-i="speaker" class="i20"></i></div>
          <span class="end bot" data-dc-id="volume-group-bottom">−</span><div class="mutecap raised" data-dc-id="mute"><i data-i="mute" class="i20"></i></div>
        </div>
        <span class="engrave" data-dc-id="volume-group-label">Volume</span>
      </div>
    </div>

    <div class="channel well transport" data-dc-id="transport">
      <div class="mcap sm" data-dc-id="prev"><i data-i="prev" class="i28"></i></div>
      <div class="mcap play" data-dc-id="play-pause"><span class="ring" data-dc-id="play-ring"></span><i data-i="playPause" class="i32"></i></div>
      <div class="mcap sm" data-dc-id="next"><i data-i="next" class="i28"></i></div>
    </div>
  </main>
  <nav class="rail" data-dc-id="mode-rail">
    <div class="track well" data-dc-id="rail-track">
      <div class="seg on raised" data-dc-id="rail-media"><i data-i="modeMedia"></i><span class="lb">Media</span></div>
      <div class="seg" data-dc-id="rail-pad"><i data-i="modeMouse"></i><span class="lb">Mouse</span></div>
      <div class="seg" data-dc-id="rail-keys"><i data-i="modeKeys"></i><span class="lb">Keys</span></div>
      <div class="seg" data-dc-id="rail-macros"><i data-i="modeMacros"></i><span class="lb">Macros</span></div>
    </div>
  </nav>
  <div class="navbar"></div>

</div>
<script src="icons.js"></script>
<script src="flicker.js"></script>
</body>
</html>
