<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mote — Media</title>
<link rel="stylesheet" href="mote.css">
<style>
  .media { display: flex; flex-direction: column; height: 100%; }
  .fav-head { display: flex; align-items: center; justify-content: space-between; height: 24px; color: var(--on-surface-subtle); }
  .fav-head span { display: inline-flex; align-items: center; gap: 6px; }
  .favs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
  .fav { height: 64px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; color: var(--on-surface); }
  .fav .lb { font: 600 12px/14px var(--font-ui); color: var(--on-surface-muted); white-space: nowrap; }
  .fav.gesture { grid-column: span 2; flex-direction: row; padding: 0 8px; }
  .nav-row { display: grid; grid-template-columns: 56px 208px 56px; justify-content: space-between; align-items: end; margin-top: 22px; }
  .nav-row .kc { width: 52px; height: 40px; border-radius: 13px; display: grid; place-items: center; font: 600 13px/1 var(--font-ui); color: var(--on-surface-muted); }
  .sec-row { margin-top: auto; }
  .transport { display: grid; grid-template-columns: 64px auto 64px; justify-content: space-between; align-items: center; margin-top: 20px; }
  .transport .side { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; color: var(--on-surface); }
  .vol { margin-top: 20px; grid-template-columns: 1fr 76px 1fr; }
</style>
</head>
<body>
<div class="screen" data-dc-id="screen">
  <div class="statusbar" data-dc-id="statusbar"><span>9:41</span><span class="sys"><i data-i="wifiBars" class="i16"></i><i data-i="battery" class="i20"></i></span></div>
  <header class="topbar" data-dc-id="topbar">
    <div class="pill raised" data-dc-id="connection-pill">
      <span class="led" data-dc-id="pill-led"></span>
      <span class="name" data-dc-id="pill-name">MacBook Pro</span>
      <i data-i="chevDown" class="i20 chev" data-dc-id="pill-chevron"></i>
    </div>
    <div class="brand" data-dc-id="brand">
      <span class="wordmark" data-dc-id="wordmark">Mote</span>
      <div class="icon-btn" data-dc-id="menu"><i data-i="more" class="i20"></i></div>
    </div>
  </header>
  <main class="content media" data-dc-id="media-content">
    <section class="fav-wrap" data-dc-id="fav-strip">
      <div class="fav-head"><span class="t-caps"><i data-i="starFill" class="i16"></i>Favourites</span><span class="t-caps" data-dc-id="fav-edit">Edit</span></div>
      <div class="favs"><div class="fav gesture raised" data-dc-id="fav-next-space">
        <div class="slide"><i data-i="chevLeft" class="i20" data-dc-id="fav-next-space-prev"></i>
          <div class="mid"><i data-i="spaces"></i><span class="lb" style="color:var(--on-surface)">Spaces</span><span class="hint" data-dc-id="fav-next-space-hint">hold &amp; slide</span></div>
          <i data-i="chevRight" class="i20" data-dc-id="fav-next-space-next"></i></div>
      </div><div class="fav raised" data-dc-id="fav-spotlight"><i data-i="search" class="ic"></i><span class="lb">Spotlight</span></div><div class="fav raised" data-dc-id="fav-lock"><i data-i="lock" class="ic"></i><span class="lb">Lock</span></div></div>
    </section>

    <div class="nav-row" data-dc-id="dpad-row">
      <div class="kc raised" data-dc-id="esc">esc</div>
      <svg class="dpad" viewBox="0 0 208 208" data-dc-id="dpad">
        <defs><linearGradient id="dpk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--key-top)"/><stop offset="1" style="stop-color:var(--key-bot)"/></linearGradient></defs>
        <circle class="housing" cx="104" cy="104" r="104"/>
        <circle class="disc" cx="104" cy="104" r="96" fill="url(#dpk)"/>
        <path class="rim" d="M22 86A96 96 0 0 1 186 86"/>
        <g data-dc-id="dpad-up"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g><g data-dc-id="dpad-right" transform="rotate(90 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g><g data-dc-id="dpad-down" transform="rotate(180 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g><g data-dc-id="dpad-left" transform="rotate(270 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 27l7 9.5h-14z"/></g>
        <g><line class="div" x1="73" y1="73" x2="47" y2="47"/><line class="div" x1="135" y1="73" x2="161" y2="47"/><line class="div" x1="73" y1="135" x2="47" y2="161"/><line class="div" x1="135" y1="135" x2="161" y2="161"/></g>
        <g data-dc-id="dpad-center"><circle class="ring" cx="104" cy="104" r="42"/><circle class="cap" cx="104" cy="104" r="35" fill="url(#dpk)"/><path class="rim" d="M76 96A30 30 0 0 1 132 96"/><text class="ok" x="104" y="109.5" text-anchor="middle">OK</text></g>
      </svg>
      <div class="lever well" data-dc-id="scroll-lever">
        <i data-i="chevUp" class="i20" data-dc-id="scroll-notch-up"></i>
        <div class="thumb raised" data-dc-id="scroll-thumb"><span class="grip"></span><span class="grip"></span><span class="grip"></span></div>
        <i data-i="chevDown" class="i20" data-dc-id="scroll-notch-down"></i>
      </div>
    </div>

    <div class="sec-row" data-dc-id="brightness-row">
      <div class="pair small well" data-dc-id="brightness-group">
        <div class="cap raised" data-dc-id="brightness-down"><i data-i="sunDown"></i></div>
        <div class="cap raised" data-dc-id="brightness-up"><i data-i="sunUp"></i></div>
      </div>
    </div>

    <div class="transport" data-dc-id="transport">
      <div class="side raised" data-dc-id="prev"><i data-i="prev" class="i28"></i></div>
      <div class="bezel" data-dc-id="play-bezel"><div class="play accent-cap" data-dc-id="play-pause"><i data-i="playPause" class="i32"></i></div></div>
      <div class="side raised" data-dc-id="next"><i data-i="next" class="i28"></i></div>
    </div>

    <div class="pair well vol" data-dc-id="volume-group">
      <div class="cap raised" data-dc-id="volume-down"><i data-i="volDown" class="i28"></i></div>
      <div class="cap raised" data-dc-id="mute"><i data-i="mute"></i></div>
      <div class="cap raised" data-dc-id="volume-up"><i data-i="volUp" class="i28"></i></div>
    </div>
  </main>
  <nav class="rail" data-dc-id="mode-rail">
    <div class="track well" data-dc-id="rail-track">
      <div class="seg on raised" data-dc-id="rail-media"><i data-i="modeMedia"></i><span class="lb">Media</span></div>
      <div class="seg" data-dc-id="rail-pad"><i data-i="modeMouse"></i><span class="lb">Mouse</span></div>
      <div class="seg" data-dc-id="rail-keys"><i data-i="modeKeys"></i><span class="lb">Keys</span></div>
      <div class="seg" data-dc-id="rail-macros"><i data-i="modeMacros"></i><span class="lb">Macros</span></div>
    </div>
  </nav>
  <div class="navbar"></div>

</div>
<script src="icons.js"></script>
</body>
</html>
