<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8">
<title>mote — Media (light)</title>
<link rel="stylesheet" href="mote.css">
<style>
  .media { display: flex; flex-direction: column; height: 100%; }
  .bright-row { display: flex; justify-content: center; margin-top: auto; }
  .bright-row .group { width: 232px; }
  .transport { display: flex; justify-content: center; align-items: center; gap: 28px; margin-top: 36px; }
  .dpad-row { position: relative; height: 208px; margin-top: 32px; display: flex; justify-content: center; }
  .dpad-row .side { position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .dpad-row .side.l { left: 6px; }
  .dpad-row .side.r { right: 6px; }
  .side .mbtn { font: 500 12px/16px var(--font-mono); letter-spacing: .5px; color: var(--on-surface-muted); }
  .vol-row { display: flex; gap: var(--gap-media); margin-top: 28px; }
  .vol-row .group { flex: 1; height: 64px; }
  .readout .t-display { line-height: 36px; }
  .readout .t-caps { color: var(--on-surface-muted); line-height: 14px; }
</style>
</head>
<body>
<div class="screen" data-dc-id="screen">
  <div class="statusbar" data-dc-id="statusbar"><span>9:41</span><span class="sys"><i data-i="wifiBars" class="i16"></i><i data-i="battery" class="i20"></i></span></div>

  <header class="topbar" data-dc-id="topbar">
    <div class="pill" data-dc-id="connection-pill">
      <span class="dot"></span>
      <span class="t-caps" data-dc-id="pill-name">MacBook Pro</span>
    </div>
    <div class="icon-btn" data-dc-id="menu"><i data-i="more"></i></div>
  </header>

  <main class="content media live" data-dc-id="media-content">
    <div class="bright-row" data-dc-id="brightness-row">
      <div class="group small" data-dc-id="brightness-group">
        <div class="half" data-dc-id="brightness-down"><i data-i="sunMinus"></i></div>
        <span class="t-caps subtle">Brightness</span>
        <div class="half" data-dc-id="brightness-up"><i data-i="sunPlus"></i></div>
      </div>
    </div>

    <div class="transport" data-dc-id="transport">
      <div class="mbtn raised" data-dc-id="prev"><i data-i="prev" class="i28"></i></div>
      <div class="mbtn primary" data-dc-id="play-pause"><i data-i="play" class="i28"></i></div>
      <div class="mbtn raised" data-dc-id="next"><i data-i="next" class="i28"></i></div>
    </div>

    <div class="dpad-row" data-dc-id="dpad-row">
      <div class="side l"><div class="mbtn s56 raised" data-dc-id="esc">esc</div></div>
      <svg class="dpad" viewBox="0 0 208 208" data-dc-id="dpad">
        <circle class="base" cx="104" cy="104" r="103.5"/>
        <g data-dc-id="dpad-up"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 25l9 12h-18z" stroke-linejoin="round"/></g>
        <g data-dc-id="dpad-right" transform="rotate(90 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 25l9 12h-18z"/></g>
        <g data-dc-id="dpad-down" transform="rotate(180 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 25l9 12h-18z"/></g>
        <g data-dc-id="dpad-left" transform="rotate(270 104 104)"><path class="arm" d="M30.46 30.46A104 104 0 0 1 177.54 30.46L132.28 75.72A40 40 0 0 0 75.72 75.72Z"/><path class="tri" d="M104 25l9 12h-18z"/></g>
        <g class="divs">
          <line class="div" x1="75.7" y1="75.7" x2="36.1" y2="36.1"/>
          <line class="div" x1="132.3" y1="75.7" x2="171.9" y2="36.1"/>
          <line class="div" x1="75.7" y1="132.3" x2="36.1" y2="171.9"/>
          <line class="div" x1="132.3" y1="132.3" x2="171.9" y2="171.9"/>
        </g>
        <g data-dc-id="dpad-center">
          <circle class="center" cx="104" cy="104" r="36"/>
          <circle class="center-hi" cx="104" cy="104" r="35.5" clip-path="inset(0 0 60% 0)"/>
          <path d="M115 95v5a3 3 0 0 1-3 3H94m4.5-4.5L94 103l4.5 4.5" fill="none" stroke="var(--on-surface)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      <div class="side r"><div class="mbtn s56 raised" data-dc-id="space">space</div></div>
    </div>

    <div class="vol-row" data-dc-id="volume-row">
      <div class="mbtn raised" data-dc-id="mute"><i data-i="mute" class="i28"></i></div>
      <div class="group" data-dc-id="volume-group">
        <div class="half" data-dc-id="volume-down"><i data-i="minus" class="i28"></i></div>
        <div class="readout" data-dc-id="volume-readout">
          <span class="t-display">+2</span>
          <span class="t-caps">Volume</span>
        </div>
        <div class="half" data-dc-id="volume-up"><i data-i="plus" class="i28"></i></div>
      </div>
    </div>
  </main>

  <nav class="rail" data-dc-id="mode-rail">
    <div class="seg on" data-dc-id="rail-media"><span class="ind"><i data-i="modeMedia"></i></span><span class="t-caps">Media</span></div>
    <div class="seg" data-dc-id="rail-pad"><span class="ind"><i data-i="modePad"></i></span><span class="t-caps">Pad</span></div>
    <div class="seg" data-dc-id="rail-keys"><span class="ind"><i data-i="modeKeys"></i></span><span class="t-caps">Keys</span></div>
    <div class="seg" data-dc-id="rail-macros"><span class="ind"><i data-i="modeMacros"></i></span><span class="t-caps">Macros</span></div>
  </nav>
  <div class="navbar"></div>
</div>
<script src="icons.js"></script>
</body>
</html>
