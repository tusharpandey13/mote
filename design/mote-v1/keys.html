<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mote — Keys</title>
<link rel="stylesheet" href="mote.css">
<style>
  .keys { display: flex; flex-direction: column; height: 100%; }
  .row { display: flex; gap: var(--gap-key); }
  .row > * { flex: 1 1 0; min-width: 0; }
  .row .w15 { flex-grow: 1.6; }
  .row .w2 { flex-grow: 2.1; }
  .row .sp { flex-grow: 4.4; }
  .row.indent { padding: 0 17px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; height: 32px; color: var(--on-surface-subtle); }
  .sec-head .tog { display: inline-flex; align-items: center; gap: 4px; }
  .upper { display: flex; flex-direction: column; gap: var(--gap-key); }
  .lower { margin-top: auto; display: flex; flex-direction: column; gap: var(--gap-key); }
  .chord {
    height: 48px; margin-bottom: 6px; border-radius: var(--r-s);
    background: var(--surface-1); border: 1px solid var(--outline);
    display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px;
  }
  .chord .mini { height: 28px; min-width: 28px; padding: 0 6px; border-radius: 8px; display: grid; place-items: center;
    background: var(--modifier-armed); color: var(--on-modifier); font: 600 14px/1 var(--font-mono); }
  .chord .mini.lk { box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 3.5px var(--modifier-armed); }
  .chord .plus { font: 500 12px/16px var(--font-mono); letter-spacing: .5px; color: var(--on-surface-muted); }
  .chord .slot { width: 28px; height: 28px; border-radius: 8px; border: 1px dashed var(--outline); }
  .chord .clr { margin-left: auto; height: 36px; padding: 0 12px; border-radius: var(--r-full); display: inline-flex; align-items: center; color: var(--on-surface-muted); }
  .modrow { display: flex; gap: var(--gap); margin-top: 6px; }
  .modrow .mod { flex: 1; }
  .key.mod .g { font-size: 18px; line-height: 20px; }
  .key.mod .n { font-size: 10px; line-height: 12px; }
</style>
</head>
<body>
<div class="screen" data-dc-id="screen">
  <div class="statusbar"><span>9:41</span><span class="sys"><i data-i="wifiBars" class="i16"></i><i data-i="battery" class="i20"></i></span></div>

  <header class="topbar" data-dc-id="topbar">
    <div class="pill" data-dc-id="connection-pill"><span class="dot"></span><span class="t-caps">MacBook Pro</span></div>
    <div class="icon-btn" data-dc-id="menu"><i data-i="more"></i></div>
  </header>

  <main class="content keys live" data-dc-id="keys-content">
    <section class="upper" data-dc-id="upper-keys">
      <div class="sec-head">
        <span class="t-caps">Function keys</span>
        <span class="tog t-caps" data-dc-id="fn-collapse">Hide <i data-i="chevUp" class="i16"></i></span>
      </div>
      <div class="row" data-dc-id="f-row-1">
        <div class="key fn">esc</div><div class="key fn">F1</div><div class="key fn">F2</div><div class="key fn">F3</div><div class="key fn">F4</div><div class="key fn">F5</div><div class="key fn">F6</div>
      </div>
      <div class="row" data-dc-id="f-row-2">
        <div class="key fn">F7</div><div class="key fn">F8</div><div class="key fn">F9</div><div class="key fn">F10</div><div class="key fn">F11</div><div class="key fn">F12</div><div class="key fn">del</div>
      </div>
      <div class="row" data-dc-id="nav-row" style="margin-top: 6px">
        <div class="key fn">home</div><div class="key fn">end</div><div class="key fn">pg↑</div><div class="key fn">pg↓</div>
        <div class="key tint" style="font-size:16px">←</div><div class="key tint" style="font-size:16px">↑</div><div class="key tint" style="font-size:16px">↓</div><div class="key tint" style="font-size:16px">→</div>
      </div>
    </section>

    <section class="lower" data-dc-id="keyboard">
      <div class="chord" data-dc-id="chord-preview">
        <span class="mini lk" data-dc-id="chord-shift">⇧</span>
        <span class="mini" data-dc-id="chord-cmd">⌘</span>
        <span class="plus">+</span>
        <span class="slot"></span>
        <span class="plus">next key</span>
        <span class="clr t-caps" data-dc-id="chord-clear">Clear</span>
      </div>

      <div class="row" data-dc-id="row-numbers">
        <div class="key"><span class="sub">!</span>1</div><div class="key"><span class="sub">@</span>2</div><div class="key"><span class="sub">#</span>3</div><div class="key"><span class="sub">$</span>4</div><div class="key"><span class="sub">%</span>5</div><div class="key"><span class="sub">^</span>6</div><div class="key"><span class="sub">&amp;</span>7</div><div class="key"><span class="sub">*</span>8</div><div class="key"><span class="sub">(</span>9</div><div class="key"><span class="sub">)</span>0</div>
      </div>
      <div class="row" data-dc-id="row-q">
        <div class="key">Q</div><div class="key">W</div><div class="key">E</div><div class="key">R</div><div class="key">T</div><div class="key">Y</div><div class="key">U</div><div class="key">I</div><div class="key">O</div><div class="key">P</div>
      </div>
      <div class="row indent" data-dc-id="row-a">
        <div class="key">A</div><div class="key">S</div><div class="key">D</div><div class="key">F</div><div class="key">G</div><div class="key">H</div><div class="key">J</div><div class="key">K</div><div class="key">L</div>
      </div>
      <div class="row" data-dc-id="row-z">
        <div class="key mod locked w15" data-dc-id="mod-shift"><span class="g">⇧</span><span class="n">shift</span></div>
        <div class="key">Z</div><div class="key">X</div><div class="key">C</div><div class="key">V</div><div class="key">B</div><div class="key">N</div><div class="key">M</div>
        <div class="key wide w15" data-dc-id="key-backspace"><i data-i="backspace"></i></div>
      </div>
      <div class="row" data-dc-id="row-bottom">
        <div class="key wide w15" data-dc-id="key-symbols">#+=</div>
        <div class="key wide" data-dc-id="key-tab">⇥</div>
        <div class="key">,</div>
        <div class="key tint sp" data-dc-id="key-space"></div>
        <div class="key">.</div>
        <div class="key wide w2" data-dc-id="key-return"><i data-i="ret"></i></div>
      </div>

      <div class="modrow" data-dc-id="modifier-row">
        <div class="mod disabled" data-dc-id="mod-fn"><span class="g">fn</span><span class="n">n/a</span></div>
        <div class="mod" data-dc-id="mod-ctrl"><span class="g">⌃</span><span class="n">ctrl</span></div>
        <div class="mod" data-dc-id="mod-opt"><span class="g">⌥</span><span class="n">opt</span></div>
        <div class="mod armed" data-dc-id="mod-cmd"><span class="g">⌘</span><span class="n">cmd</span></div>
      </div>
    </section>
  </main>

  <nav class="rail" data-dc-id="mode-rail">
    <div class="seg" data-dc-id="rail-media"><span class="ind"><i data-i="modeMedia"></i></span><span class="t-caps">Media</span></div>
    <div class="seg" data-dc-id="rail-pad"><span class="ind"><i data-i="modePad"></i></span><span class="t-caps">Pad</span></div>
    <div class="seg on" data-dc-id="rail-keys"><span class="ind"><i data-i="modeKeys"></i></span><span class="t-caps">Keys</span></div>
    <div class="seg" data-dc-id="rail-macros"><span class="ind"><i data-i="modeMacros"></i></span><span class="t-caps">Macros</span></div>
  </nav>
  <div class="navbar"></div>
</div>
<script src="icons.js"></script>
</body>
</html>
