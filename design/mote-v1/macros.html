<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mote — Macros</title>
<link rel="stylesheet" href="mote.css">
<style>
  .macros { display: flex; flex-direction: column; height: 100%; }
  .mhead { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; }
  .mhead .icon-btn { margin-right: -12px; }
  .hint { margin-top: 4px; }
  .grid { margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
  .tile .ch { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="screen" data-dc-id="screen">
  <div class="statusbar"><span>9:41</span><span class="sys"><i data-i="wifiBars" class="i16"></i><i data-i="battery" class="i20"></i></span></div>

  <header class="topbar" data-dc-id="topbar">
    <div class="pill" data-dc-id="connection-pill"><span class="dot"></span><span class="t-caps">MacBook Pro</span></div>
    <div class="icon-btn" data-dc-id="menu"><i data-i="more"></i></div>
  </header>

  <main class="content macros live" data-dc-id="macros-content">
    <div class="mhead" data-dc-id="macros-header">
      <h1 class="t-headline">Macros</h1>
      <div class="icon-btn" data-dc-id="macros-edit"><i data-i="edit"></i></div>
    </div>
    <p class="t-body subtle hint" data-dc-id="macros-hint">Tap to run. Hold to edit or drag.</p>

    <div class="grid" data-dc-id="macro-grid">
      <div class="tile" data-tint="blue" data-dc-id="macro-screenshot"><i data-i="camera" class="ic"></i><div><div class="nm">Screenshot area</div><div class="ch">⌘⇧4</div></div></div>
      <div class="tile" data-tint="indigo" data-dc-id="macro-mission"><i data-i="windows" class="ic"></i><div><div class="nm">Mission Control</div><div class="ch">⌃↑</div></div></div>
      <div class="tile" data-tint="slate" data-dc-id="macro-spotlight"><i data-i="search" class="ic"></i><div><div class="nm">Spotlight</div><div class="ch">⌘ space</div></div></div>

      <div class="tile" data-tint="indigo" data-dc-id="macro-next-space"><i data-i="spaces" class="ic"></i><div><div class="nm">Next Space</div><div class="ch">⌃→</div></div></div>
      <div class="tile" data-tint="teal" data-dc-id="macro-zoom-mute"><i data-i="mic" class="ic"></i><div><div class="nm">Zoom mute</div><div class="ch">⌘⇧A</div></div></div>
      <div class="tile" data-tint="violet" data-dc-id="macro-slideshow"><i data-i="present" class="ic"></i><div><div class="nm">Play slideshow</div><div class="ch">⌥⌘P</div></div></div>

      <div class="tile" data-tint="sand" data-dc-id="macro-type-email"><i data-i="text" class="ic"></i><div><div class="nm">Type email</div><div class="ch">21 chars</div></div></div>
      <div class="tile" data-tint="cyan" data-dc-id="macro-open-safari"><i data-i="apps" class="ic"></i><div><div class="nm">Open Safari</div><div class="ch">3 steps</div></div></div>
      <div class="tile confirm" data-dc-id="macro-lock-confirm"><i data-i="lock" class="ic"></i><div><div class="nm">Tap again</div><div class="ch">⌃⌘Q lock</div></div></div>

      <div class="tile" data-tint="magenta" data-dc-id="macro-force-quit"><i data-i="power" class="ic"></i><div><div class="nm">Force quit</div><div class="ch">⌥⌘⎋</div></div></div>
      <div class="tile" data-tint="slate" data-dc-id="macro-hide-others"><i data-i="windows" class="ic"></i><div><div class="nm">Hide others</div><div class="ch">⌥⌘H</div></div></div>
      <div class="tile add" data-dc-id="macro-add"><i data-i="plus" class="i28"></i><span class="t-label" style="margin-top:6px">New macro</span></div>
    </div>
  </main>

  <nav class="rail" data-dc-id="mode-rail">
    <div class="seg" data-dc-id="rail-media"><span class="ind"><i data-i="modeMedia"></i></span><span class="t-caps">Media</span></div>
    <div class="seg" data-dc-id="rail-pad"><span class="ind"><i data-i="modePad"></i></span><span class="t-caps">Pad</span></div>
    <div class="seg" data-dc-id="rail-keys"><span class="ind"><i data-i="modeKeys"></i></span><span class="t-caps">Keys</span></div>
    <div class="seg on" data-dc-id="rail-macros"><span class="ind"><i data-i="modeMacros"></i></span><span class="t-caps">Macros</span></div>
  </nav>
  <div class="navbar"></div>
</div>
<script src="icons.js"></script>
</body>
</html>
