name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'design/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site references the artboards, icons and fonts at design/; copy them in instead of duplicating in git.
      - name: Assemble site
        run: |
          mkdir -p _site/design
          cp -R site/. _site/
          cp -R design/mote-v1/. _site/design/
          rm -f _site/design/comments.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
